<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك في مشروعي الأول</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            color: #1e293b;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        h1 {
            color: #0284c7;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #475569;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            background-color: #f0fdf4;
            color: #16a34a;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid #bbf7d0;
            margin-bottom: 20px;
        }
        .footer {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 20px;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">🚀 البداية الجديدة</span>
        <h1>مرحباً بكم في مشروعي الأول!</h1>
        <p>هذا هو مشروعي البرمجي الأول على الإطلاق، حيث أخطو خطواتي الأولى والمثيرة في عالم تطوير مواقع الويب. قمت بتصميم هذه الصفحة البسيطة لأرحب بكم وأشارككم انطلاقتي في هذا المجال الرائع.</p>
        <div class="footer">
            تم التطوير بكل حب ❤️ | 2026
        </div>
    </div>
</body>
</html>
